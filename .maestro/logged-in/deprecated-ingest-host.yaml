appId: ${APP_ID}
---
# The harness's second account streams RTMP through the hostname the harness
# node treats as a deprecated ingest host (pkg/cmd/e2e.go), and its live
# dashboard should say to change the server. Web counterpart:
# js/e2e-web/flows/deprecated-ingest-host.spec.ts.
#
# This switches to that account and back, so the phase ends as it began:
# signed in as the harness account.
- runFlow: ../setup/sign-out.yaml
- runFlow:
    file: ../setup/sign-in.yaml
    env:
      HANDLE: ${DEPRECATED_HOST_ACCOUNT_HANDLE}
      PASSWORD: ${DEPRECATED_HOST_ACCOUNT_PASSWORD}
- takeScreenshot: deprecated-ingest-host-signed-in

# The dashboard, by the app's own link to it: the same on both platforms,
# where the header entry points differ.
- openLink: ${APP_ID}://live
- extendedWaitUntil:
    visible:
      text: "Update your stream server"
    timeout: 60000
- assertVisible:
    text: ".*streaming to localhost, an old address.*"
- takeScreenshot: deprecated-ingest-host-dashboard

- runFlow: ../setup/sign-out.yaml
- runFlow:
    file: ../setup/sign-in.yaml
    env:
      HANDLE: ${ACCOUNT_HANDLE}
      PASSWORD: ${ACCOUNT_PASSWORD}
