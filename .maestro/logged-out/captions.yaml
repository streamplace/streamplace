appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-stream-card"
    timeout: 30000
- tapOn:
    id: "home-stream-card"
- extendedWaitUntil:
    visible:
      text: ".*e2e test stream.*"
    timeout: 30000
# The player's controls fade 3 s after a tap and a playing stream never
# settles, so each reveal skips Maestro's settle wait and each control step
# retries until its result shows.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          point: 50%,20%
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "player-cc-menu-button"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible:
            id: "player-cc-track-off"
          timeout: 5000
- tapOn:
    id: "player-cc-track-off"
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          point: 50%,20%
          waitToSettleTimeoutMs: 500
      - tapOn:
          id: "player-cc-menu-button"
          waitToSettleTimeoutMs: 500
      - runScript:
          file: push-caption.js
          env:
            CAPTION_API_URL: ${CAPTION_API_URL}
            STREAM_KEY: ${STREAM_KEY}
            ACCOUNT_DID: ${ACCOUNT_DID}
      - extendedWaitUntil:
          visible:
            id: "player-cc-track-${output.captionTrackID}"
          timeout: 10000
# Choosing a track turns captions on.
- tapOn:
    id: "player-cc-track-${output.captionTrackID}"
- assertNotVisible:
    id: "player-cc-menu"
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: push-caption.js
          env:
            CAPTION_API_URL: ${CAPTION_API_URL}
            STREAM_KEY: ${STREAM_KEY}
            ACCOUNT_DID: ${ACCOUNT_DID}
      - extendedWaitUntil:
          visible:
            text: ".*Maestro live caption proof.*"
          timeout: 15000
- assertVisible:
    id: "caption-overlay-text"
- takeScreenshot: caption-visible
# The toggle is tapped only while it is on, so a retry can't turn it back on.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          point: 50%,20%
          waitToSettleTimeoutMs: 500
      - runFlow:
          when:
            visible:
              id: "player-cc-button"
              checked: true
          commands:
            - tapOn:
                id: "player-cc-button"
                waitToSettleTimeoutMs: 500
      - assertVisible:
          id: "player-cc-button"
          checked: false
- assertNotVisible:
    id: "caption-overlay-text"
- takeScreenshot: caption-off
