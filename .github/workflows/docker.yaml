name: docker-build

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker-build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # - name: Extract metadata (tags, labels) for Docker
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: |
      #       ghcr.io/${{ github.repository }}
      #     tags: |
      #       type=sha
      #       type=ref,event=pr
      #       type=ref,event=tag
      #       type=sha,format=long
      #       type=ref,event=branch
      #       type=semver,pattern={{version}},prefix=v
      #       type=semver,pattern={{major}}.{{minor}},prefix=v
      #       type=raw,value=latest,enable={{is_default_branch}}
      #       type=raw,value=${{ github.event.pull_request.head.ref }}
      #       type=raw,value=stable,enable=${{ startsWith(github.event.ref, 'refs/tags/v') }}

      # - name: Login to DockerHub
      #   uses: docker/login-action@v2
      #   with:
      #     username: ${{ secrets.CI_DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.CI_DOCKERHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          push: true
          file: docker/build.Dockerfile
          # build-args: |
          #   GIT_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.event.pull_request.head.sha || github.sha }}
          tags:
            ghcr.io/streamplace/streamplace:builder-${{
            hashFiles('docker/build.Dockerfile') }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
