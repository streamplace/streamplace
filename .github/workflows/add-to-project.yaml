name: add-to-project

on:
  issues:
    types:
      - opened

jobs:
  add-to-project:
    name: add-to-project
    runs-on: ubuntu-slim
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/streamplace/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
