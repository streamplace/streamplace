appId: ${APP_ID}
---
# The harness's test VOD (VIDEO_URI) is the real fixture, run through the VOD
# pipeline: opened by deep link, it shows its title and plays.
- evalScript:
    ${output.watchPath = ACCOUNT_HANDLE + "/video/" + VIDEO_URI.split("/")[4]}
# Start through the link, not a launcher intent racing the JS URL listener.
- stopApp
- openLink: ${APP_ID}://${output.watchPath}
- extendedWaitUntil:
    visible:
      text: ".*e2e test video.*"
    timeout: 30000
- takeScreenshot: vod-open
# Don't wait for a playing video to settle past the controls' 6s fade timer.
# Capture the position left of "/" so duration text cannot prove advancement.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible: "Pause"
          commands:
            - tapOn:
                point: 50%,20%
                waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          visible: "Pause"
          timeout: 15000
      - copyTextFrom:
          text: "[0-9]+:[0-5][0-9]"
          leftOf: "/"
      - evalScript: ${output.vodPosition = maestro.copiedText}
      - extendedWaitUntil:
          visible:
            text: ${"(?!" + output.vodPosition + "$)[0-9]+:[0-5][0-9]"}
            leftOf: "/"
          timeout: 3000
- takeScreenshot: vod-playing
