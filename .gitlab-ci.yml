.release-template:
  stage: build
  interruptible: true
  image: "$DOCKER_REPO:builder-$DOCKERFILE_HASH"
  needs:
    - build-darwin-amd64
    - build-darwin-arm64
    - build-android-debug
    - build-android-release
    - build-desktop-darwin
    - build-ios
    - test
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/'
  timeout: 2 hours

npm-release:
  extends:
    - .release-template
  script:
    - make ci-npm-release

release:
  extends:
    - .release-template
  script:
    - make ci-release

deb-release:
  extends:
    - .release-template
  script:
    - make ci-deb-release

homebrew-release:
  extends:
    - .release-template
  script:
    - make ci-homebrew

.report-status:
  tags:
    - tiny-job
  interruptible: true
  image:
    name: curlimages/curl
    entrypoint: [""]
  variables:
    STATUS_PROJECT: streamplace/streamplace
    STATUS_NAME: git.stream.place
  script:
    # For complete details on the GitHub API please see:
    # https://developer.github.com/v3/repos/statuses
    - >
      set -eu && curl -L
      --fail-with-body
      --silent
      -X POST
      -H "Accept: application/vnd.github+json"
      -H "Authorization: Bearer $GITHUB_TOKEN"
      -H "X-GitHub-Api-Version: 2022-11-28"
      https://api.github.com/repos/${STATUS_PROJECT}/statuses/${CI_COMMIT_SHA}
      -d '{"state":"'${CI_JOB_NAME}'","target_url":"'${CI_PIPELINE_URL}'","description":"'${STATUS_NAME}'","context":"'${STATUS_NAME}'"}'
  environment:
    name: reporting-github
  dependencies: []

pending:
  stage: .pre
  extends:
    - .report-status

success:
  stage: .post
  extends:
    - .report-status

failure:
  stage: .post
  extends:
    - .report-status
  rules:
    - when: on_failure
