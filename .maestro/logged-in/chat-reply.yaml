appId: ${APP_ID}
---
# Reply to a chat message by swiping it to the left. The runner configures
# the harness and signs in before running any logged-in flow.
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-stream-card"
    timeout: 30000
- tapOn:
    id: "home-stream-card"
# chat needs the stream's context, which arrives over its websocket along
# with this system message
- extendedWaitUntil:
    visible:
      text: ".*e2e test stream.*"
    timeout: 30000
# Create the message to reply to.
- runFlow:
    file: ../setup/send-chat.yaml
    env:
      CHAT_MESSAGE: "reply target from chat-reply"
- extendedWaitUntil:
    visible:
      text: ".*: reply target from chat-reply"
    timeout: 15000
- swipe:
    from:
      text: ".*: reply target from chat-reply"
    direction: LEFT
- extendedWaitUntil:
    visible:
      id: "chat-reply-preview"
    timeout: 10000
- takeScreenshot: chat-reply-replying
# picking a message to reply to focuses the chat box
- inputText: "a reply from chat-reply"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: ".*: a reply from chat-reply"
    timeout: 15000
- assertNotVisible:
    id: "chat-reply-preview"
- takeScreenshot: chat-reply-sent
# Relaunch, so the reply comes from the node's chat history: its quote of the
# parent ("@<handle> <message>", no colon) proves the record carried the reply
# reference through the PDS and firehose.
- launchApp
- tapOn:
    id: "home-stream-card"
- extendedWaitUntil:
    visible:
      text: ".*: a reply from chat-reply"
    timeout: 30000
- assertVisible:
    text: "@${ACCOUNT_HANDLE} reply target from chat-reply"
- takeScreenshot: chat-reply-history
