[package]
name = "iroh-streamplace"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lib]
name = "iroh_streamplace"
crate-type = ["rlib", "cdylib"]

[dependencies]
iroh = "1.4.1"
iroh-tickets = "1.0.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# Keep the metadata ABI aligned with Makefile's uniffi-bindgen-go generator.
uniffi = { version = "=0.28.3", features = ["tokio"] }
url = "2.5.8"
bytes = { version = "1.12.1", features = ["serde"] }
n0-future = "0.3.2"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
snafu = "0.9.2"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
irpc = "0.17.0"
irpc-iroh = "0.17.0"
c2pa = { git = "https://github.com/streamplace/c2pa-rs.git", rev = "81d737bd117743d8146cd8317604162af4df269f", default-features = false, features = [
  "rust_native_crypto",
  "file_io",
] }
thiserror = "2.0.21"
serde_json = "1.0.154"
iroh-smol-kv = "0.4.0"
hex = "0.4.3"
# iroh-smol-kv 0.4 exposes this version's GossipTopic in its public API.
iroh-gossip = "0.101.0"
ref-cast = "1.0.27"
base64 = "0.23.1"

[dev-dependencies]
testresult = "0.4.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
