# 00-server-setup must run first: it points the app at the e2e test server.
# Without an explicit order Maestro may run flows in any order, silently
# testing against production instead.
# 05-oauth-login runs after the logged-out flows: every flow before it
# expects a logged-out app, and every flow after it a logged-in one.
executionOrder:
  continueOnFailure: false
  flowsOrder:
    - 00-server-setup
    - 01-smoke
    - 02-tabs
    - 04-stream
    - 05-oauth-login
    - 06-chat-reply
