  darwin:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - name: darwin-arm64
            runs-on: macos-15
            cmd: make && make test && make check
            xcode-version: "16.4"
          - name: ios
            runs-on: macos-26
            cmd: make ios
            xcode-version: "26.3"
          - name: darwin-amd64
            runs-on: macos-15-intel
            cmd: make
            xcode-version: "16.4"
    steps:
      - name: Check out code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode-version }}

      - name: Build Streamplace
        env:
          STREAMPLACE_TEST_COUNT: "1"
          STREAMPLACE_IGNORE_LEAKS: "true"
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: |
          npm install -g corepack@latest \
          && corepack enable \
          && export GOTOOLCHAIN=go1.25.1 \
          && brew install go llvm \
          && rustup target add wasm32-wasip1 \
          && rustup target add wasm32-unknown-unknown \
          && python -m pip install virtualenv \
          && python -m virtualenv ~/venv \
          && source ~/venv/bin/activate \
          && python -m pip install meson \
          && PATH="/opt/homebrew/opt/llvm/bin:$PATH" \
          && ${{ matrix.cmd }}

      - name: Upload streamplace binary
        if: matrix.name == 'darwin-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: streamplace-darwin-arm64-${{ github.run_id }}
          path: ./build-darwin-arm64/streamplace
          retention-days: 1

  android-e2e:
    name: android-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [linux, darwin]
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: setup pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: install dependencies
        run: pnpm install

      - name: build js bundle and generate native project
        working-directory: js/app
        run: pnpm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: build debug apk
        working-directory: js/app/android
        run: ./gradlew assembleDebug

      - name: download streamplace binary
        uses: actions/download-artifact@v4
        with:
          name: streamplace-linux-amd64-${{ github.run_id }}
          path: .

      - name: make streamplace executable
        run: chmod +x ./streamplace

      - name: start e2e environment
        run: |
          ./streamplace e2e > /tmp/e2e-env.sh &
          for i in $(seq 1 120); do
            if [ -s /tmp/e2e-env.sh ]; then break; fi
            sleep 1
          done
          cat /tmp/e2e-env.sh

      - name: install maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-pixel-6-api-34-v2

      - name: create avd snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options:
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: true
          script: echo "avd snapshot created"

      - name: run maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options:
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            . /tmp/e2e-env.sh
            ANDROID_SERVER_URL="$(echo "$SERVER_URL" | sed 's/127\.0\.0\.1/10.0.2.2/')"
            adb install -r js/app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test -e APP_ID=tv.aquareum -e SERVER_URL="$ANDROID_SERVER_URL" -e ACCOUNT_HANDLE="$ACCOUNT_HANDLE" .maestro/

      - name: upload maestro recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android-${{ github.run_id }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: warn

  ios-e2e:
    name: ios-e2e
    runs-on: macos-26
    timeout-minutes: 75
    needs: [linux, darwin]
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: setup pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: install dependencies
        run: pnpm install

      - name: build js bundle and generate native project
        working-directory: js/app
        run: pnpm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: install pods
        working-directory: js/app/ios
        run: pod install

      - name: install maestro and idb
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          brew tap facebook/fb
          brew install facebook/fb/idb-companion

      - name: build for simulator
        run: |
          xcodebuild \
            -workspace js/app/ios/Streamplace.xcworkspace \
            -scheme Streamplace \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath js/app/ios/build \
            -destination 'platform=iOS Simulator,name=iPhone Air,OS=26.1' \
            build

      - name: boot simulator and install app
        run: |
          xcrun simctl boot "iPhone Air" || true
          xcrun simctl install booted js/app/ios/build/Build/Products/Debug-iphonesimulator/Streamplace.app

      - name: download streamplace binary
        uses: actions/download-artifact@v4
        with:
          name: streamplace-darwin-arm64-${{ github.run_id }}
          path: .

      - name: make streamplace executable
        run: chmod +x ./streamplace

      - name: start e2e environment
        run: |
          ./streamplace e2e > /tmp/e2e-env.sh &
          for i in $(seq 1 120); do
            if [ -s /tmp/e2e-env.sh ]; then break; fi
            sleep 1
          done
          cat /tmp/e2e-env.sh

      - name: run maestro tests
        run: |
          source /tmp/e2e-env.sh
          maestro test -e APP_ID=tv.aquareum -e SERVER_URL="$SERVER_URL" -e ACCOUNT_HANDLE="$ACCOUNT_HANDLE" .maestro/

      - name: upload maestro recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios-${{ github.run_id }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: warn
