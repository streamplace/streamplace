<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.Title}}</title>
    <style>
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #0b0b0f;
        color: #f5f5f7;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 2rem;
        box-sizing: border-box;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{.Title}}</h1>
      <p>{{.Message}}</p>
    </main>
  </body>
</html>
