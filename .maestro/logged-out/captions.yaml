appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-stream-card"
    timeout: 30000
- tapOn:
    id: "home-stream-card"
- extendedWaitUntil:
    visible:
      text: ".*e2e test stream.*"
    timeout: 30000
# e2e builds keep the player's controls up, so they are tapped directly.
- tapOn:
    id: "player-cc-menu-button"
- tapOn:
    id: "player-cc-track-off"
- tapOn:
    id: "player-cc-menu-button"
- retry:
    maxRetries: 3
    commands:
      - runScript:
          file: push-caption.js
          env:
            CAPTION_API_URL: ${CAPTION_API_URL}
            STREAM_KEY: ${STREAM_KEY}
            ACCOUNT_DID: ${ACCOUNT_DID}
      - extendedWaitUntil:
          visible:
            id: "player-cc-track-${output.captionTrackID}"
          timeout: 10000
# Choosing a track turns captions on.
- tapOn:
    id: "player-cc-track-${output.captionTrackID}"
- assertNotVisible:
    id: "player-cc-menu"
- retry:
    maxRetries: 5
    commands:
      - runScript:
          file: push-caption.js
          env:
            CAPTION_API_URL: ${CAPTION_API_URL}
            STREAM_KEY: ${STREAM_KEY}
            ACCOUNT_DID: ${ACCOUNT_DID}
      - extendedWaitUntil:
          visible:
            text: ".*Maestro live caption proof.*"
          timeout: 15000
- assertVisible:
    id: "caption-overlay-text"
- takeScreenshot: caption-visible
- tapOn:
    id: "player-cc-button"
- assertVisible:
    id: "player-cc-button"
    checked: false
- assertNotVisible:
    id: "caption-overlay-text"
- takeScreenshot: caption-off
