appId: ${APP_ID}
---
# No clearState: the app is freshly installed on a fresh device in CI, so
# there's nothing to clear, and clearState reinstalls the app — which
# resets the notification permission we pre-granted, re-showing the
# first-launch permission dialog that dims the screen and blocks taps.
- launchApp
- takeScreenshot: server-setup-launched
# A slow CI emulator can throw a "Pixel Launcher isn't responding" dialog
# over the app, which the runner's hide_error_dialogs doesn't suppress; tap
# Wait if it's there.
- tapOn:
    text: "Wait"
    optional: true
# first launch on a cold CI emulator can take a while to render
- extendedWaitUntil:
    visible:
      text: "Settings"
    timeout: 60000
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Settings"
- takeScreenshot: server-setup-settings
- scrollUntilVisible:
    element:
      text: "Advanced"
- tapOn:
    text: "Advanced"
- takeScreenshot: server-setup-advanced
# These three are custom RN components matched by testID: on iOS the
# accessibilityRole="switch" toggle collapses its subtree and hides the
# label from text matching, and the wrapped Input/Button aren't reliably
# findable by placeholder/label text either.
- tapOn:
    id: "settings-use-custom-node"
- takeScreenshot: server-setup-custom-node-toggled
- tapOn:
    id: "settings-custom-node-url"
- inputText: "${SERVER_URL}"
# dismiss the keyboard, which otherwise covers the bottom Home tab on iOS
# and blocks navigation back to the feed
- hideKeyboard
- takeScreenshot: server-setup-url-entered
- tapOn:
    id: "settings-save-node"
- takeScreenshot: server-setup-saved
- tapOn:
    text: "Home"
# Standalone nodes already index the fixture stream. Upstream local nodes
# intentionally have no indexed users until the following OAuth login flow.
- runFlow:
    when:
      true: ${E2E_UPSTREAM_STATION != "true"}
    commands:
      - extendedWaitUntil:
          visible:
            text: ".*e2e test stream.*"
          timeout: 30000
- takeScreenshot: server-setup-home
