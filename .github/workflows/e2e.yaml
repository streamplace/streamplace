name: e2e

on:
  pull_request:
  push:
    branches:
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [linux, darwin]
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: setup pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: install dependencies
        run: pnpm install

      - name: build js bundle and generate native project
        working-directory: js/app
        run: pnpm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: build debug apk
        working-directory: js/app/android
        run: ./gradlew assembleDebug

      - name: download streamplace binary
        uses: actions/download-artifact@v4
        with:
          name: streamplace-linux-amd64-${{ github.run_id }}
          path: .

      - name: make streamplace executable
        run: chmod +x ./streamplace

      - name: start e2e environment
        run: |
          ./streamplace e2e > /tmp/e2e-env.sh &
          for i in $(seq 1 120); do
            if [ -s /tmp/e2e-env.sh ]; then break; fi
            sleep 1
          done
          cat /tmp/e2e-env.sh

      - name: install maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: enable kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-pixel-6-api-34-v2

      - name: create avd snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options:
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          disable-animations: true
          script: echo "avd snapshot created"

      - name: run maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options:
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            source /tmp/e2e-env.sh
            ANDROID_SERVER_URL="${SERVER_URL/127.0.0.1/10.0.2.2}"
            adb install -r js/app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test \
              -e APP_ID=tv.aquareum \
              -e SERVER_URL="$ANDROID_SERVER_URL" \
              -e ACCOUNT_HANDLE="$ACCOUNT_HANDLE" \
              .maestro/

  ios-e2e:
    runs-on: macos-26
    timeout-minutes: 75
    needs: [linux, darwin]
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: setup pnpm
        run: npm install -g corepack@latest && corepack enable

      - name: install dependencies
        run: pnpm install

      - name: build js bundle and generate native project
        working-directory: js/app
        run: pnpm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: install pods
        working-directory: js/app/ios
        run: pod install

      - name: install maestro and idb
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH
          brew tap facebook/fb
          brew install facebook/fb/idb-companion

      - name: build for simulator
        run: |
          xcodebuild \
            -workspace js/app/ios/Streamplace.xcworkspace \
            -scheme Streamplace \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath js/app/ios/build \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            build

      - name: boot simulator and install app
        run: |
          xcrun simctl boot "iPhone 15 Pro" || true
          xcrun simctl install booted js/app/ios/build/Build/Products/Debug-iphonesimulator/Streamplace.app

      - name: download streamplace binary
        uses: actions/download-artifact@v4
        with:
          name: streamplace-darwin-arm64-${{ github.run_id }}
          path: .

      - name: make streamplace executable
        run: chmod +x ./streamplace

      - name: start e2e environment
        run: |
          ./streamplace e2e > /tmp/e2e-env.sh &
          for i in $(seq 1 120); do
            if [ -s /tmp/e2e-env.sh ]; then break; fi
            sleep 1
          done
          cat /tmp/e2e-env.sh

      - name: run maestro tests
        run: |
          source /tmp/e2e-env.sh
          maestro test \
            -e APP_ID=tv.aquareum \
            -e SERVER_URL="$SERVER_URL" \
            -e ACCOUNT_HANDLE="$ACCOUNT_HANDLE" \
            .maestro/
