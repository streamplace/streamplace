packages:
  - js/*
nodeLinker: hoisted
allowBuilds:
  "@firebase/util": false
  "@sentry/cli": true
  "@swc/core": true
  better-sqlite3: true
  bufferutil: true
  cbor-extract: true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  fs-xattr: true
  keccak: true
  macos-alias: true
  nx: true
  protobufjs: true
  quietjs-bundle: true
  sharp: true
  utf-8-validate: true
  workerd: true
patchedDependencies:
  "@atproto-labs/fetch@0.4.1": patches/@atproto-labs__fetch@0.4.1.patch
  core-js: patches/core-js.patch
  lex-md: patches/lex-md.patch
overrides:
  # typescript-eslint supports TypeScript <6.1; keep optional peers aligned.
  typescript: ~6.0.3
  # lex 0.4.4 still exports its own walk; schema 0.2.10 adds a conflicting export.
  # Keep PDS startup working until lex publishes the matching #5786 migration.
  "@atproto/lex-schema": 0.2.9
  # Lerna's changelog tools pin 7.1.2 below their git client's ^7.1.3 peer.
  "conventional-commits-parser@7.1.2": 7.1.4
  # lerna pulls in this deprecated stub, which breaks tsc's implicit @types.
  "@types/parse-path": "-"
  # Upstream consumers still pin older releases within these compatible API lines.
  "form-data@4.0.4": 4.0.6
  "postcss-selector-parser@6.0.10": 6.1.5
  "@grpc/grpc-js@~1.9.0": 1.14.7
  "stream-json@3.5.0": 3.8.0
minimumReleaseAgeExclude:
  - "@astrojs/starlight@0.42.9"
  - "@babel/core@7.29.13"
  - "@babel/generator@7.29.13"
  - "@babel/helper-compilation-targets@7.29.13"
  - "@babel/helper-module-transforms@7.29.13"
  - "@babel/helpers@7.29.13"
  - "@babel/parser@7.29.13"
  - "@babel/runtime@7.29.13"
  - "@babel/traverse@7.29.13"
  - "@cloudflare/workers-types@5.20261104.1"
  - conventional-commits-parser@7.1.4
  - electron@45.2.2
  - lucide-react-native@1.68.0
  - lucide-react@1.68.0
