appId: ${APP_ID}
---
- launchApp
- takeScreenshot: 04-01-launched
# open the e2e test account's live stream from the home feed
- extendedWaitUntil:
    visible:
      text: "e2e test stream"
    timeout: 30000
- tapOn:
    text: "e2e test stream"
- waitForAnimationToEnd
- takeScreenshot: 04-02-stream-open
- assertVisible:
    text: ".*e2e test stream.*"
# tap on the video to show the player controls
- tapOn:
    point: 50%,20%
- takeScreenshot: 04-03-player-tapped
