name: golangci-lint

on:
  push:
  pull_request:

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    # build.yaml is the cache writer; this duplicate build only restores.
    cache-mode: read
    timeout-minutes: 60
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: run build for linting
        run: |
          sudo apt install podman -y
          # libpod's default SHM semaphores leak when a lock holder dies
          # (observed on runner images >= 20260823: an exec-session cleanup
          # process dies holding the container lock and every later podman
          # exec blocks forever in sem_wait); file locks auto-release
          mkdir -p ~/.config/containers
          printf '[engine]\nlock_type = "file"\n' >> ~/.config/containers/containers.conf
          sudo ln -s $(realpath ./hack/golangci-lint) /usr/bin/golangci-lint
          make golangci-lint-container BUILDER_TARGET=builder-no-darwin DOCKER_BUILD_OPTS="--layers --cache-to ghcr.io/streamplace/streamplace --cache-from ghcr.io/streamplace/streamplace" DOCKER_OPTS="-e ACTIONS_RESULTS_URL -e ACTIONS_RUNTIME_TOKEN -e SCCACHE_GHA_ENABLED=on -e SCCACHE_GHA_RW_MODE=READ_ONLY -e SCCACHE_GHA_VERSION=1 -e SCCACHE_BASEDIRS=$PWD -e 'CC=sccache gcc' -e 'CXX=sccache g++' -e RUSTC_WRAPPER=sccache"

      - name: sanity-check wrapper from bash
        run:
          timeout 120 /usr/bin/golangci-lint config path
          --config=./.golangci.yaml

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1
          args: --config=./.golangci.yaml
          install-mode: none

      - name: sccache statistics
        if: always()
        run: |
          if podman container exists golangci-lint; then
            podman exec golangci-lint sccache --show-stats
          fi
