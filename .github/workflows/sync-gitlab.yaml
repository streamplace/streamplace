name: Sync Repo to GitLab

on: push

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: keninkujovic/gitlab-sync@2.0.0
        with:
          gitlab_url: https://git.stream.place/streamplace/streamplace.git
          username: streamplace-robot
          gitlab_pat: ${{ secrets.GITLAB_PAT }}
