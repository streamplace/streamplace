name: build

on:
  pull_request:
  push:
    branches:
      - next

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: linux-amd64
            cmd: >-
              make linux-amd64 && make test-vod && make static-test && make
              check && make ci-lexicons
          - name: linux-arm64
            cmd: "make linux-arm64"
          - name: windows-amd64
            cmd: "make windows-amd64 && make desktop-windows-amd64"
          - name: android
            cmd: "make app && make android-release"
    steps:
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Check out code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: mise check
        if: matrix.name == 'linux-amd64'
        uses: jdx/mise-action@v2
        with:
          install: true

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: make node
        run: |
          sudo apt install podman -y
          make in-container BUILDER_TARGET=builder-no-darwin DOCKER_PWD_MOUNT_PATH=/app DOCKER_BUILD_OPTS="--layers --cache-to ghcr.io/streamplace/streamplace --cache-from ghcr.io/streamplace/streamplace" DOCKER_OPTS="-e STREAMPLACE_IGNORE_LEAKS=true -e STREAMPLACE_TEST_COUNT=1 -e CI=true -e GITHUB_ACTION=true" IN_CONTAINER_CMD="${{ matrix.cmd }}"

      - name: Publish Test Report
        if: matrix.name == 'linux-amd64' && (success() || failure())
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "test.xml"

      - name: Upload bin artifacts
        if: matrix.name == 'windows-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin-${{ github.event.pull_request.head.sha }}
          path: ./bin/
          retention-days: 1

      - name: Upload streamplace binary
        if: matrix.name == 'linux-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: streamplace-linux-amd64-${{ github.run_id }}
          path: ./build-linux-amd64/streamplace
          retention-days: 1

      - name: Upload android release APK
        if: matrix.name == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ github.run_id }}
          path: ./bin/*android-release.apk
          retention-days: 1

