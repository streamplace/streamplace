# Sweeps the native app shell and verifies the disabled create controls stay hidden.
# Screenshots are captured per step and land in artifacts/home (see scripts/ui-shoot.sh).
# APP_ID is the bundle id: scripts/ui-shoot.sh passes the dev one, hack/ios-smoke.sh reads it from the build.
appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 60000
- assertNotVisible: "Create"
- assertNotVisible: "Go Live"
- takeScreenshot: 01-home
- tapOn: "Videos"
- assertVisible: "Videos"
- takeScreenshot: 02-videos
- tapOn: "Settings"
- assertVisible: "Settings"
- takeScreenshot: 03-settings
- tapOn: "Home"
- assertVisible: "Home"
- takeScreenshot: 04-home-return
