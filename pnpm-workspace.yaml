packages:
  - js/*
onlyBuiltDependencies:
  - "@swc/core"
  - better-sqlite3
  - bufferutil
  - cbor-extract
  - electron
  - electron-winstaller
  - esbuild
  - fs-xattr
  - keccak
  - macos-alias
  - nx
  - protobufjs
  - quietjs-bundle
  - sharp
  - utf-8-validate
patchedDependencies:
  core-js: patches/core-js.patch
  lex-md: patches/lex-md.patch
overrides:
  # Expo SDK 55 peers on typescript ^5; without this, optional typescript peers
  # resolve to 6.x.
  typescript: ~5.9.3
  # lerna pulls in this deprecated stub, which breaks tsc's implicit @types.
  "@types/parse-path": "-"
