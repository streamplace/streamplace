# Use a landscape recording on a portrait phone, supplied through VIDEO_URL.
# pnpm app ui:shoot video-player -e VIDEO_URL=<recording deep link>
appId: tv.aquareum.dev
---
- setOrientation: PORTRAIT
- launchApp
- openLink: "tv.aquareum.dev://video"
- assertVisible: "Videos"
- openLink: ${VIDEO_URL}
- extendedWaitUntil:
    visible: "Pause"
    timeout: 30000
- tapOn:
    point: "50%,20%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertNotVisible: "Back"
- assertNotVisible: "Pause"
- assertNotVisible: "Playback settings"
- tapOn:
    point: "50%,20%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- tapOn:
    # Coordinate delivery avoids a second XCTest lookup consuming the timeout.
    point: "10%,29%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible: "Play"
- tapOn:
    point: "50%,20%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertNotVisible: "Back"
- assertNotVisible: "Play"
- tapOn:
    point: "50%,20%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible: "Play"
- assertVisible: "Playback position.*"
- assertVisible: "Back"
- assertVisible: "Enter fullscreen"
- assertVisible: "Like video"
- assertVisible: "Share video"
- takeScreenshot: 01-paused
- tapOn: "Playback settings"
- assertVisible: "(?s)Quality.*"
- takeScreenshot: 02-settings
- tapOn:
    id: "menu-backdrop"
- tapOn: "Share video"
- assertVisible: "Copy Link"
- takeScreenshot: 03-share
- tapOn:
    id: "menu-backdrop"
- tapOn:
    text: "Play"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible: "Pause"
- tapOn:
    point: "10%,29%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible: "Play"
- tapOn:
    text: "Back"
    waitToSettleTimeoutMs: 500
- assertVisible: "Videos"
