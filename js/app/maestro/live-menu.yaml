# Use a landscape live channel supplied through STREAM_URL.
appId: tv.aquareum.dev
---
- setOrientation: PORTRAIT
- launchApp
- openLink: ${STREAM_URL}
- extendedWaitUntil:
    visible: "Expand stream info"
    timeout: 30000
- extendedWaitUntil:
    notVisible: "Playback settings"
    timeout: 30000
- tapOn:
    # Reveal and activate settings in one gesture, within the HUD timeout.
    point: "91%,10%"
    repeat: 2
    delay: 100
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- assertVisible: "(?s)Quality.*"
- assertVisible: "Chat-only mode"
- takeScreenshot: 01-menu
- tapOn: "(?s)Quality.*"
- assertVisible: "Resolution"
- assertVisible: "Source.*"
- takeScreenshot: 02-quality
- tapOn: "Quality"
- assertVisible: "Chat-only mode"
- takeScreenshot: 03-menu-return
