# The app must be connected to Metro before running this flow (ui:shoot does it).
# Relative selectors catch content rendered behind the transparent iOS header.
appId: tv.aquareum.dev
---
- launchApp
- openLink: "tv.aquareum.dev://settings/languages"
- assertVisible:
    text: "Language"
    below: "Languages"
- takeScreenshot: 01-languages
- openLink: "tv.aquareum.dev://settings/advanced"
- assertVisible:
    id: "settings-use-custom-node"
    below: "Advanced"
- takeScreenshot: 02-advanced
- openLink: "tv.aquareum.dev://settings/about"
- assertVisible:
    text: "Streamplace v.*"
    below: "About"
- takeScreenshot: 03-about
- openLink: "tv.aquareum.dev://settings"
- assertVisible:
    text: "Languages"
    below:
      text: "Settings"
      index: 0
- takeScreenshot: 04-settings
