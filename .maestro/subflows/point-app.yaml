appId: ${APP_ID}
---
# Point the app at NODE_URL: Settings -> Advanced, custom node on, replace
# the URL, save.
- tapOn:
    text: "Settings"
- scrollUntilVisible:
    element:
      text: "Advanced"
- tapOn:
    text: "Advanced"
# The URL field only shows while "use custom node" is on.
- runFlow:
    when:
      notVisible:
        id: "settings-custom-node-url"
    commands:
      - tapOn:
          id: "settings-use-custom-node"
- tapOn:
    id: "settings-custom-node-url"
- eraseText: 200
- inputText: "${NODE_URL}"
- hideKeyboard
- tapOn:
    id: "settings-save-node"
