appId: ${APP_ID}
---
- launchApp
- tapOn:
    text: "Go Live"
- takeScreenshot: 03-01-go-live-prompt
- assertVisible:
    text: "Ready to go live?"
- assertVisible:
    text: "Start streaming"
- tapOn:
    text: "Start streaming"
- takeScreenshot: 03-02-after-start-streaming
# match the modal's plain-text title ("Log in"); the "Log In" button text
# is inside a Pressable that collapses on iOS and isn't findable
- assertVisible:
    text: "Log [Ii]n"
- takeScreenshot: 03-03-log-in
