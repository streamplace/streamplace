appId: ${APP_ID}
---
# Sign out from Settings -> Account, and wait for the signed-out home screen.
- launchApp
- tapOn:
    text: "Settings"
- tapOn:
    text: "Account"
- scrollUntilVisible:
    element:
      text: "Log out"
- tapOn:
    text: "Log out"
- launchApp
- extendedWaitUntil:
    visible:
      text: "Log in"
    timeout: 30000
