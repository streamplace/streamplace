appId: ${APP_ID}
# The harness's second account streams with no livestream record (pre-live).
# Another viewer opening its page must never get the video.
# The Web counterpart is js/e2e-web/flows/prelive-playback.spec.ts.
---
# A cold deep link, as in lazy-navigation.yaml: a link sent while the app is
# still starting can be dropped.
- stopApp
- openLink: "${APP_ID}://${PRELIVE_ACCOUNT_HANDLE}"
# the stream page, not the feed (matched as a substring: iOS collapses it)
- extendedWaitUntil:
    visible:
      text: ".*@${PRELIVE_ACCOUNT_HANDLE}.*"
    timeout: 60000
# A published stream reaches player-video within this window (av1.yaml), so
# give it the same and then require that no video frames arrived.
- extendedWaitUntil:
    visible:
      id: "player-video"
    timeout: 30000
    optional: true
- takeScreenshot: prelive-hidden-not-playing
- assertNotVisible:
    id: "player-video"
