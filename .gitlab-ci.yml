include: ".ci/dockerfile-hash.yaml"

workflow:
  rules:
    # Tag pushes (releases) always build.
    - if: "$CI_COMMIT_TAG"
    # A release pushes the `next` branch and a `vX.Y.Z` tag at the same commit,
    # which would otherwise spawn two pipelines that build everything twice. The
    # tag pipeline above already covers it, so skip the redundant `next` build.
    # Release commits are titled like the tag (e.g. "v0.10.40"), so match on that.
    - if: '$CI_COMMIT_BRANCH == "next" && $CI_COMMIT_TITLE =~ /^v?\d+\.\d+\.\d+$/'
      when: never
    # Everything else (normal branch pushes) builds as usual.
    - when: always

variables:
  DOCKER_REPO: "public.ecr.aws/m4j3c0j7/streamplace"

.build:
  stage: build
  interruptible: true
  image: "$DOCKER_REPO:builder-$DOCKERFILE_HASH"
  timeout: 2 hours
  script:
    - rm -rf /usr/x86_64-w64-mingw32/include/d3dcompiler.h /usr/share/mingw-w64/include/d3dcompiler.h /usr/lib/gcc/x86_64-w64-mingw32/10-posix/libssp.dll.a /usr/lib/gcc/x86_64-w64-mingw32/10-posix/libssp-0.dll /usr/lib/gcc/x86_64-w64-mingw32/10-win32/libssp-0.dll /usr/lib/gcc/x86_64-w64-mingw32/10-win32/libssp.dll.a
    - git fetch --unshallow || echo 'already unshallow'
    - bash -c "make version && make $TARGET && make test-vod && make desktop-$TARGET && make pkg-$TARGET && make ci-upload-node-$TARGET -j$(nproc)"
  artifacts:
    reports:
      dotenv: .ci/build.env

build-linux-amd64:
  extends:
    - .build
  variables:
    TARGET: linux-amd64

build-linux-arm64:
  extends:
    - .build
  variables:
    TARGET: linux-arm64

build-windows-amd64:
  extends:
    - .build
  variables:
    TARGET: windows-amd64

build-darwin-arm64:
  extends:
    - .build
  variables:
    TARGET: darwin-arm64

build-darwin-amd64:
  extends:
    - .build
  variables:
    TARGET: darwin-amd64

leak-test-viewers:
  stage: build
  interruptible: true
  needs:
    - job: build-linux-amd64
      artifacts: true
  image:
    name: "$DOCKER_REPO:bunny"
  variables:
    SP_WIDE_OPEN: "true"
    SP_NO_FIREHOSE: "true"
    SP_WHIP_TEST: "--file=/bunny.mp4 --count=1 --viewers=50 --duration=5m"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    GOGC: "20"
    GOMEMLIMIT: "2GiB"
  timeout: "10 minutes"
  allow_failure: true
  script:
    - /bunny.sh

leak-test-streamers:
  stage: build
  interruptible: true
  needs:
    - job: build-linux-amd64
      artifacts: true
  image:
    name: "$DOCKER_REPO:bunny"
  variables:
    SP_WIDE_OPEN: "true"
    SP_NO_FIREHOSE: "true"
    SP_WHIP_TEST: "--file=/bunny.mp4 --count=10 --duration=5m"
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "2Gi"
    GOGC: "20"
    GOMEMLIMIT: "2GiB"
  timeout: "10 minutes"
  allow_failure: true
  script:
    - /bunny.sh

test:
  stage: build
  interruptible: true
  image: "$DOCKER_REPO:builder-$DOCKERFILE_HASH"
  timeout: 2 hours
  variables:
    STREAMPLACE_TEST_COUNT: "1"
  script:
    - git fetch --unshallow || echo 'already unshallow'
    - make dev-setup && make dev && make dev-test && make ci-lexicons
  artifacts:
    when: always
    paths:
      - test.xml
    reports:
      junit: test.xml

.build-android:
  stage: build
  interruptible: true
  image: "$DOCKER_REPO:builder-$DOCKERFILE_HASH"
  timeout: 2 hours
  script:
    - git fetch --unshallow || echo 'already unshallow'
    - make $TARGET -j$(nproc)

build-android-debug:
  extends:
    - .build-android
  variables:
    TARGET: ci-android-debug

build-android-release:
  extends:
    - .build-android
  variables:
    TARGET: ci-android-release

.build-on-mac:
  stage: build
  interruptible: true
  image: ghcr.io/cirruslabs/macos-tahoe-xcode:26.3
  tags:
    - tart-installed
  variables:
    STREAMPLACE_TEST_COUNT: "1"
    NODE_OPTIONS: "--max_old_space_size=4096"
  timeout: 2 hours
  script:
    # workaround for https://gitlab.com/gitlab-org/gitlab/-/issues/501457
    # which is a workaround for ios builds failing due to /tmp vs /private/tmp weirdness
    - cd ..
    - mv streamplace /Users/admin/streamplace
    - cd /Users/admin/streamplace
    - git fetch --unshallow || echo 'already unshallow'
    - brew install ninja go openssl@3 && go version
    - export PATH="/opt/homebrew/opt/node@22/bin:$PATH"
    - brew install node@22
    - node --version
    - npm install -g corepack@latest --force
    - corepack enable
    - sudo gem uninstall xcodeproj -x --ignore-dependencies
    - sudo gem install xcodeproj -v 1.25.1
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > rustup.sh && bash rustup.sh -y && rm rustup.sh
    - export PATH="$PATH:$HOME/.cargo/bin"
    - echo $PATH
    - 'echo "which xcodeproj: $(which xcodeproj)"'
    - 'echo "xcodeproj --version: $(xcodeproj --version)"'
    - "$(which xcodeproj) --version"
    - >
      export GOTOOLCHAIN=go1.25.1
      && python3 -m pip install virtualenv
      && python3 -m virtualenv ~/venv
      && source ~/venv/bin/activate
      && python3 -m pip install meson
      && ${=COMMAND}
    # ^^ zsh-ism for running command with spaces

build-ios:
  extends:
    - .build-on-mac
  variables:
    COMMAND: make ci-ios -j16

build-desktop-darwin:
  extends:
    - .build-on-mac
  needs:
    - build-darwin-amd64
    - build-darwin-arm64
  variables:
    COMMAND: make ci-desktop-darwin

