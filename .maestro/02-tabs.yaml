appId: ${APP_ID}
---
- launchApp
- takeScreenshot: 02-01-home
- assertVisible:
    text: "Live now"
# native builds hide the create controls (no Go Live tab, no Create button)
- assertNotVisible:
    text: "Go Live"

- tapOn:
    text: "Videos"
- takeScreenshot: 02-02-videos
- assertNotVisible:
    text: "Live now"

- tapOn:
    text: "Settings"
- takeScreenshot: 02-03-settings
- assertVisible:
    text: "Settings"

- tapOn:
    text: "Home"
- takeScreenshot: 02-04-home-return
- assertVisible:
    text: "Live now"
