appId: ${APP_ID}
---
# Runs after 05-oauth-login and 06-chat-reply with the harness account signed in.
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-stream-card"
    timeout: 30000
- tapOn:
    id: "home-stream-card"
- extendedWaitUntil:
    visible:
      text: ".*e2e test stream.*"
    timeout: 30000
# Give this account a visible row even if earlier chat has scrolled away.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "chat-input"
      - eraseText: 100
      - inputText: "profile target from 07-chat-profile"
      - pressKey: Enter
      - extendedWaitUntil:
          visible:
            text: ".*: profile target from 07-chat-profile"
          timeout: 15000
- tapOn:
    id: "chat-profile-trigger-${ACCOUNT_HANDLE}"
    index: 0
- extendedWaitUntil:
    visible:
      id: "chat-profile-card"
    timeout: 10000
# Match the card's identity, not another occurrence in the chat underneath.
- assertVisible:
    id: "chat-profile-handle"
    text: "@${ACCOUNT_HANDLE}"
- assertVisible: "View Profile"
- assertNotVisible:
    id: "menu-error"
- takeScreenshot: 07-01-profile
# The top of the backdrop is outside the sheet on both iOS and Android.
# Do not use Android Back: the regression must exercise shared dismissal.
- assertVisible:
    id: "menu-backdrop"
- tapOn:
    point: "50%,10%"
- extendedWaitUntil:
    notVisible:
      id: "chat-profile-card"
    timeout: 10000
- tapOn:
    id: "chat-profile-trigger-${ACCOUNT_HANDLE}"
    index: 0
- extendedWaitUntil:
    visible:
      id: "chat-profile-handle"
      text: "@${ACCOUNT_HANDLE}"
    timeout: 10000
- assertVisible: "View Profile"
- assertNotVisible:
    id: "menu-error"
- takeScreenshot: 07-02-profile-reopened
- tapOn:
    point: "50%,10%"
- extendedWaitUntil:
    notVisible:
      id: "chat-profile-card"
    timeout: 10000
# No retry/relaunch before this send: dismissing the sheet must leave chat usable.
- tapOn:
    id: "chat-input"
- inputText: "chat after profile from 07-chat-profile"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: ".*: chat after profile from 07-chat-profile"
    timeout: 15000
# Reload from server history so an optimistic local echo cannot pass the test.
- launchApp
- extendedWaitUntil:
    visible:
      id: "home-stream-card"
    timeout: 30000
- tapOn:
    id: "home-stream-card"
- extendedWaitUntil:
    visible:
      text: ".*: chat after profile from 07-chat-profile"
    timeout: 30000
- takeScreenshot: 07-03-chat-history
