packages:
  - js/*
onlyBuiltDependencies:
  - "@swc/core"
  - better-sqlite3
  - bufferutil
  - cbor-extract
  - electron
  - electron-winstaller
  - esbuild
  - fs-xattr
  - keccak
  - macos-alias
  - nx
  - protobufjs
  - quietjs-bundle
  - sharp
  - utf-8-validate
patchedDependencies:
  core-js: patches/core-js.patch
  lex-md: patches/lex-md.patch
overrides:
  # Expo SDK 55 peers on typescript ^5; without this, optional typescript peers
  # resolve to 6.x.
  typescript: ~5.9.3
  # jsdom 30 needs Node 22.22; the builder runs 22.15. Without this, vitest's
  # optional jsdom peer resolves to 30 in workspaces that don't list jsdom.
  jsdom: ^29.1.1
  # One esbuild 0.27 for everything that accepts it. pnpm 10's post-build
  # hoisting races when it hard-links the same built package into several
  # nested copies (ERR_PNPM_EEXIST), which vite pulling 0.28 caused.
  "esbuild@>=0.27.0": 0.27.4
  # lerna pulls in this deprecated stub, which breaks tsc's implicit @types.
  "@types/parse-path": "-"
