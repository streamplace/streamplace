[package]
name = "export_c2pa_schema"
authors = ["Streamplace <support@stream.place>"]
license = "MIT OR Apache-2.0"
edition = "2018"
rust-version = "1.91"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(test)'] }
# Workaround for https://github.com/est31/cargo-udeps/issues/293.

[dependencies]
anyhow = "1.0.104"
c2pa = { git = "https://github.com/streamplace/c2pa-rs.git", rev = "81d737bd117743d8146cd8317604162af4df269f", default-features = false, features = [
  "rust_native_crypto",
  "file_io",
  "json_schema",
] }
# The c2pa fork implements JsonSchema from schemars 0.8.
schemars = "0.8.22"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.24.0"
